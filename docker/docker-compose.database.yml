version: '2'
services:

  food-planner-db:
    container_name: food-planner-db
    image: postgres:15.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: food-planner
      POSTGRES_PASSWORD: food-planner
      POSTGRES_DB: food-planner
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db/:/var/lib/postgresql